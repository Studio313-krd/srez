name: srez
x-app: &app
  image: srez:production
  pull_policy: never
  environment:
    SREZ_DEBUG: 'false'
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
    ALLOWED_HOSTS: srez.studio313.ru
    CSRF_TRUSTED_ORIGINS: https://srez.studio313.ru
    PUBLIC_URL: https://srez.studio313.ru
    TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?Set the observed reverse proxy address}
    POSTGRES_HOST: db
    POSTGRES_DB: srez
    POSTGRES_USER: srez
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    MAX_ENABLED: ${MAX_ENABLED:-false}
    MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
    MAX_CHAT_ID: ${MAX_CHAT_ID:-}
    MAX_API_URL: https://platform-api2.max.ru
    MAX_CA_BUNDLE: ${MAX_CA_BUNDLE:-}
  restart: unless-stopped
  networks: [internal]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: '10m', max-file: '3'}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: srez
      POSTGRES_USER: srez
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [internal]
    restart: unless-stopped
    mem_limit: 384m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U srez -d srez']
      interval: 5s
      timeout: 5s
      retries: 12
    logging: {driver: json-file, options: {max-size: '10m', max-file: '3'}}
  migrate:
    <<: *app
    restart: 'no'
    mem_limit: 256m
    command: [python, manage.py, migrate, --noinput]
    depends_on:
      db: {condition: service_healthy}
  web:
    <<: *app
    build: .
    pull_policy: build
    mem_limit: 384m
    ports: ['9994:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8000/api/health/",headers={"Host":"srez.studio313.ru","X-Forwarded-Proto":"https"}),timeout=5)']
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
  worker:
    <<: *app
    mem_limit: 192m
    command: [python, manage.py, run_worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, manage.py, worker_health]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
  backup:
    image: postgres:17-alpine
    environment:
      PGHOST: db
      PGDATABASE: srez
      PGUSER: srez
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          target="/backups/srez-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          pg_dump -Fc --file="$${target}.partial"
          mv "$${target}.partial" "$${target}"
          find /backups -maxdepth 1 -type f -name 'srez-*.dump' -mtime +14 -delete
          sleep 86400
        done
    volumes: [backups:/backups]
    networks: [internal]
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "find /backups -maxdepth 1 -name 'srez-*.dump' -mmin -1500 | grep -q ."]
      interval: 300s
      timeout: 10s
      retries: 2
      start_period: 60s
    logging: {driver: json-file, options: {max-size: '10m', max-file: '3'}}

volumes:
  postgres_data:
  backups:
networks:
  internal:
